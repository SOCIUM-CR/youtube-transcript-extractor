[pytest]
# Configuración de pytest para YouTube Transcript Extractor

# Directorio de tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Coverage report
    --cov=youtube_transcript_extractor
    --cov=youtube_extractor_list
    --cov=yt_url_finder
    --cov=url_processor
    # Coverage report format
    --cov-report=term-missing
    --cov-report=html
    # Warnings
    -W ignore::DeprecationWarning

# Markers personalizados
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    network: marks tests that require network connection

# Configuración de coverage
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */env/*
    setup.py
    install.py

[coverage:report]
# Excluir líneas de coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
